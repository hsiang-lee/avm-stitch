[workspace]
resolver = "2"
members = ["crates/avm-core", "crates/avm-render", "crates/avm-engine", "crates/avm-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
nalgebra = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
wgpu = "30"
naga = { version = "30", features = ["wgsl-in"] }
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
